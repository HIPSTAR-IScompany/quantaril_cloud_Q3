name: Build and Deploy Q Atlantis (Sakura shared hosting)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      adopt_existing_directory:
        description: 'receiptのない既存ディレクトリをQ Atlantis配置先として明示的に引き取る'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20' # package.json engines: ">=18.0" を満たすLTS
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Patron public data and import candidate check
        run: npm run content:check-patron

      - name: Build (Docusaurus, ja locale)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -d build || (echo "build directory missing" && exit 1)
          test -f build/index.html || (echo "index.html missing" && exit 1)
          test -f build/patron/index.html || (echo "patron route missing" && exit 1)
          test -f build/patron/data/ledger.json || (echo "patron ledger artifact missing" && exit 1)
          test -f build/patron/data/activity.json || (echo "patron activity artifact missing" && exit 1)
          test -f build/patron/data/media.json || (echo "patron media artifact missing" && exit 1)
          test -f build/patron/data/supply.json || (echo "patron supply artifact missing" && exit 1)
          test -f build/patron/data/tamagaki.json || (echo "patron tamagaki artifact missing" && exit 1)

      # content:check (転送キュー検証) はCIに含めない: pipeline/transfer-queue.jsonの
      # source.pathが兄弟リポジトリ(ZeroRoomLab-manifest)を指す設計のため、単独checkoutの
      # GitHub Actions環境では構造的に「原典が見つかりません」で失敗する。ローカル開発機での
      # 手動チェック(npm run content:check)として維持する。

      - name: Content ledger check (migration coverage)
        run: npm run content:check-ledger

      - name: Agent and persona attribution check
        run: npm run content:check-attribution

      - name: SEO metadata and social card check
        run: npm run content:check-seo

      - name: Redirects check (migration/redirects.json vs build output)
        run: npm run content:check-redirects

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: build/
          retention-days: 7

  deploy:
    name: Deploy and observe publication
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: q-atlantis-sakura-matchbox-production
      cancel-in-progress: false
    environment:
      name: sakura-matchbox-production
      url: https://quantaril.cloud
    env:
      SAKURA_HOST: ${{ vars.SAKURA_HOST }}
      SAKURA_USER: ${{ vars.SAKURA_USER }}
      SAKURA_DEPLOY_PATH: ${{ vars.SAKURA_DEPLOY_PATH }}
      PUBLICATION_URL: https://quantaril.cloud
      ADOPT_EXISTING_DIRECTORY: ${{ inputs.adopt_existing_directory || false }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site-build
          path: build/

      - name: Validate deployment contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SAKURA_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "DEPLOY_HOST_INVALID" >&2
            exit 1
          fi

          if [[ ! "$SAKURA_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "DEPLOY_USER_INVALID" >&2
            exit 1
          fi

          expected_root="/home/${SAKURA_USER}/www"
          case "$SAKURA_DEPLOY_PATH" in
            "$expected_root"|"$expected_root"/*) ;;
            *)
              echo "DEPLOY_PATH_OUT_OF_SCOPE: expected ${expected_root} or its child" >&2
              exit 1
              ;;
          esac

          if [[ ! "$SAKURA_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH_INVALID" >&2
            exit 1
          fi

      - name: Install pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HAGE_ED }}
          SSH_KEY_PASSPHRASE: ${{ secrets.HAGE_ED_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo "DEPLOY_SECRET_MISSING: HAGE_ED is not available" >&2
            exit 1
          fi
          ssh_dir="$RUNNER_TEMP/q-atlantis-ssh"
          ssh_key_path="$ssh_dir/id_key"
          ssh_known_hosts_path="$ssh_dir/known_hosts"
          ssh_askpass_path="$ssh_dir/askpass.sh"
          ssh_passphrase_path="$ssh_dir/passphrase"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_key_path"
          chmod 600 "$ssh_key_path"
          install -m 600 .github/known_hosts/sakura-matchbox-production "$ssh_known_hosts_path"

          printf '%s' "${SSH_KEY_PASSPHRASE:-}" > "$ssh_passphrase_path"
          chmod 600 "$ssh_passphrase_path"
          printf '%s\n' '#!/usr/bin/env bash' 'exec cat "$SSH_PASSPHRASE_PATH"' > "$ssh_askpass_path"
          chmod 700 "$ssh_askpass_path"

          eval "$(ssh-agent -s)" > /dev/null
          if ! SSH_PASSPHRASE_PATH="$ssh_passphrase_path" \
            SSH_ASKPASS="$ssh_askpass_path" SSH_ASKPASS_REQUIRE=force DISPLAY=q-atlantis:0 \
            ssh-add "$ssh_key_path" < /dev/null; then
            if [[ -z "${SSH_KEY_PASSPHRASE:-}" ]]; then
              echo "DEPLOY_KEY_PASSPHRASE_REQUIRED: HAGE_ED is encrypted; configure HAGE_ED_PASSPHRASE or replace it with a deployment-only unencrypted key" >&2
            else
              echo "DEPLOY_KEY_UNLOCK_FAILED: HAGE_ED_PASSPHRASE did not unlock HAGE_ED" >&2
            fi
            exit 1
          fi

          echo "SSH_KEY_PATH=$ssh_key_path" >> "$GITHUB_ENV"
          echo "SSH_KNOWN_HOSTS_PATH=$ssh_known_hosts_path" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Create publication receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/.well-known
          node --input-type=module -e '
            import fs from "node:fs";
            const receipt = {
              schema: "q-atlantis-publication-receipt/1",
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT
            };
            fs.writeFileSync(
              "build/.well-known/q-atlantis-deployment.json",
              `${JSON.stringify(receipt, null, 2)}\n`,
              "utf8"
            );
          '

      - name: Ensure deployment directory exists and is writable
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
            -o ConnectTimeout=15
          )

          if ! ssh "${ssh_options[@]}" "$SAKURA_USER@$SAKURA_HOST" \
            "mkdir -p -- '$SAKURA_DEPLOY_PATH' && test -d '$SAKURA_DEPLOY_PATH' && test -w '$SAKURA_DEPLOY_PATH'"; then
            echo "DEPLOY_PATH_PERMISSION_DENIED: could not create or write ${SAKURA_DEPLOY_PATH}" >&2
            exit 1
          fi

      - name: Confirm target identity before overwrite
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
            -o ConnectTimeout=15
          )
          remote_receipt="$SAKURA_DEPLOY_PATH/.well-known/q-atlantis-deployment.json"
          existing_receipt="$RUNNER_TEMP/q-atlantis-existing-deployment.json"

          if ssh "${ssh_options[@]}" "$SAKURA_USER@$SAKURA_HOST" "test -f '$remote_receipt'"; then
            scp "${ssh_options[@]}" "$SAKURA_USER@$SAKURA_HOST:$remote_receipt" "$existing_receipt"
            EXISTING_RECEIPT="$existing_receipt" node --input-type=module -e '
              import fs from "node:fs";
              const receipt = JSON.parse(fs.readFileSync(process.env.EXISTING_RECEIPT, "utf8"));
              if (receipt.schema !== "q-atlantis-publication-receipt/1") {
                console.error("DEPLOY_TARGET_IDENTITY_CONFLICT: receipt schema differs");
                process.exit(1);
              }
              if (receipt.repository !== process.env.GITHUB_REPOSITORY) {
                console.error("DEPLOY_TARGET_IDENTITY_CONFLICT: receipt repository differs");
                process.exit(1);
              }
              console.log(`DEPLOY_TARGET_MATCHED: previous commit ${receipt.commit ?? "unknown"}`);
            '
            exit 0
          fi

          if ssh "${ssh_options[@]}" "$SAKURA_USER@$SAKURA_HOST" \
            "ls -A '$SAKURA_DEPLOY_PATH' | grep -q ."; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$ADOPT_EXISTING_DIRECTORY" == "true" ]]; then
              echo "DEPLOY_TARGET_ADOPTED: explicit -y equivalent accepted this directory"
              exit 0
            fi

            echo "DEPLOY_TARGET_IDENTITY_UNKNOWN: directory is non-empty but has no Q Atlantis receipt" >&2
            echo "Inspect it, then rerun workflow_dispatch with adopt_existing_directory=true to accept overwrite." >&2
            exit 1
          fi

          echo "DEPLOY_TARGET_EMPTY: safe first installation"

      - name: Upload static site over SCP/SFTP transport
        shell: bash
        run: |
          set -euo pipefail
          scp_options=(
            -i "$SSH_KEY_PATH"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS_PATH"
            -o ConnectTimeout=15
          )
          scp -r -p "${scp_options[@]}" build/. "$SAKURA_USER@$SAKURA_HOST:$SAKURA_DEPLOY_PATH/"

      - name: Observe publication without cache
        shell: bash
        run: |
          set -euo pipefail
          expected="build/.well-known/q-atlantis-deployment.json"
          observed="$RUNNER_TEMP/q-atlantis-deployment-observed.json"
          receipt_url="${PUBLICATION_URL}/.well-known/q-atlantis-deployment.json?run=${GITHUB_RUN_ID}&attempt=${GITHUB_RUN_ATTEMPT}"
          last_curl_exit=0
          last_http_code=000

          for attempt in 1 2 3 4 5 6; do
            set +e
            last_http_code=$(curl \
              --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --output "$observed" \
              --write-out '%{http_code}' \
              "${receipt_url}&probe=${attempt}")
            last_curl_exit=$?
            set -e

            if [[ $last_curl_exit -eq 0 && "$last_http_code" == "200" ]] && cmp -s "$expected" "$observed"; then
              echo "PUBLICATION_OBSERVED: ${PUBLICATION_URL} serves this run receipt"
              exit 0
            fi

            if [[ $attempt -lt 6 ]]; then
              sleep 10
            fi
          done

          case "$last_curl_exit" in
            6)
              echo "DNS_UNREACHABLE: ${PUBLICATION_URL}" >&2
              ;;
            35|60)
              echo "TLS_UNREACHABLE: ${PUBLICATION_URL}" >&2
              ;;
            0)
              if [[ "$last_http_code" == "404" ]]; then
                echo "DOCROOT_OR_DEPLOY_PATH_MISMATCH: receipt returned HTTP 404" >&2
              else
                echo "PUBLICATION_RECEIPT_MISMATCH: HTTP ${last_http_code}; cache or docroot may point elsewhere" >&2
              fi
              ;;
            *)
              echo "HTTP_UNREACHABLE: curl exit ${last_curl_exit}, HTTP ${last_http_code}" >&2
              ;;
          esac
          exit 1
